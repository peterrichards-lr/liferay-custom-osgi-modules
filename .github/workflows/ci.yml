name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build against the pinned DXP version
        run: ./gradlew build --no-daemon

      - name: Resolve every bundle against the pinned DXP distro
        # The gate the manifest-printing step here was always meant to become.
        # A compile proves nothing about resolution: javac never reads OSGi
        # ranges, and bnd copies the declared Import-Package into the manifest
        # verbatim, so a stale range builds green and fails at install. That is
        # how v3.1.0 shipped four broken kernel ranges.
        #
        # `resolve` runs the real OSGi resolver against the target platform
        # distro named by liferay.workspace.product, so a range that no longer
        # matches what the line exports fails here with the same message the
        # portal would give -- offline, in seconds. It downloads the distro, so
        # this is the slow step in the job.
        #
        # Scope: this checks the ranges against the line we TARGET. It cannot
        # catch an artifact built for one line reaching a portal on another --
        # that is what the consumer-side line assertions are for.
        run: ./gradlew resolve --no-daemon

      - name: Report what each bundle imports
        run: |
          for jar in modules/*/build/libs/*.jar; do
            [ -e "$jar" ] || continue
            echo "--- $(basename "$jar") ---"
            unzip -p "$jar" META-INF/MANIFEST.MF | tr -d '\r' \
              | grep -E "Bundle-SymbolicName|Bundle-Version|Import-Package" || true
          done
