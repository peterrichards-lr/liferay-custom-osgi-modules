name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build against the pinned DXP version
        run: ./gradlew build --no-daemon

      - name: Check Import-Package ranges against the target platform
        # Cheap complement to `resolve`, not a replacement (issue #33).
        #
        # bnd cannot derive these ranges: the modules compile against the
        # aggregate release.dxp.api jar, which has no Export-Package header, so
        # bnd emits imports with no version at all. The ranges in bnd.bnd are
        # therefore hand-written -- but the numbers ARE in that jar, one
        # packageinfo file per package, and nothing stops us reading them.
        #
        # Why this earns its place next to `resolve`: the OSGi resolver reports
        # the FIRST unsatisfied requirement and stops, so a line rebump surfaces
        # one broken range per build. This reports every one of them at once, by
        # name, with the expected value -- and runs before the distro download,
        # so a stale range fails in seconds rather than minutes.
        #
        # --check-built additionally asserts that every com.liferay package the
        # BUILT bundle imports is declared at all. Checking the declared ranges
        # cannot see a missing declaration, and v3.5.3 failed at publish for
        # exactly that: a new class imported three packages absent from bnd.bnd,
        # so bnd emitted them unversioned. publish.yml already caught it, but
        # only at release time -- this brings it forward to the pull request,
        # which is where it is cheap to fix.
        run: |
          jar=$(./gradlew -q printDxpApiJar --no-daemon | tail -1)
          echo "Target platform API jar: $jar"
          python3 scripts/check_import_ranges.py "$jar" --check-built

      - name: Resolve every bundle against the pinned DXP distro
        # The gate the manifest-printing step here was always meant to become.
        # A compile proves nothing about resolution: javac never reads OSGi
        # ranges, and bnd copies the declared Import-Package into the manifest
        # verbatim, so a stale range builds green and fails at install. That is
        # how v3.1.0 shipped four broken kernel ranges.
        #
        # `resolve` runs the real OSGi resolver against the target platform
        # distro named by liferay.workspace.product, so a range that no longer
        # matches what the line exports fails here with the same message the
        # portal would give -- offline, in seconds. It downloads the distro, so
        # this is the slow step in the job.
        #
        # Scope: this checks the ranges against the line we TARGET. It cannot
        # catch an artifact built for one line reaching a portal on another --
        # that is what the consumer-side line assertions are for.
        run: ./gradlew resolve --no-daemon

      - name: Report what each bundle imports
        run: |
          for jar in modules/*/build/libs/*.jar; do
            [ -e "$jar" ] || continue
            echo "--- $(basename "$jar") ---"
            unzip -p "$jar" META-INF/MANIFEST.MF | tr -d '\r' \
              | grep -E "Bundle-SymbolicName|Bundle-Version|Import-Package" || true
          done
