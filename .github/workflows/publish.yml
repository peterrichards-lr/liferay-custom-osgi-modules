name: Publish modules

# Releases are the trigger, not pushes to main: a registry coordinate is
# immutable once consumed, so publishing should be a deliberate act with a
# version behind it rather than a side effect of merging.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify without publishing"
        type: boolean
        default: true

permissions:
  contents: write   # attach the JAR to the release
  packages: write   # publish to GitHub Packages

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Derive the release version
        # The tag drives Bundle-Version, so two builds are distinguishable and
        # an .ldmp package can record exactly which bundle it contains.
        id: ver
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          [ -n "$version" ] || version="0.0.0-manual"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          dxp=$(sed -n 's/^liferay\.workspace\.product=//p' gradle.properties | tr -d '[:space:]')
          [ -n "$dxp" ] || { echo "::error::liferay.workspace.product missing"; exit 1; }
          echo "dxp=$dxp" >> "$GITHUB_OUTPUT"
          echo "Building $version against $dxp"

      - name: Build
        # `clean` matters: build/libs is not emptied between builds, so a stale
        # jar from a previous version would be picked up by the globbing below
        # and uploaded alongside the real one. Observed while rehearsing the
        # asset step locally.
        run: ./gradlew clean build --no-daemon -Pversion="${{ steps.ver.outputs.version }}"

      - name: Resolve every bundle against the pinned DXP distro
        # A release must not be cuttable with a range the target line cannot
        # satisfy. `resolve` runs the real OSGi resolver against the distro for
        # liferay.workspace.product, and is the only check here that would have
        # stopped v3.1.0's four stale kernel ranges -- the build was green and
        # the manifest guard below passed.
        #
        # Scope: this validates the ranges against the line we TARGET. It
        # cannot catch an artifact built for one line reaching a portal on
        # another; that is what the consumer-side line assertions are for.
        run: ./gradlew resolve --no-daemon -Pversion="${{ steps.ver.outputs.version }}"

      - name: Verify every bundle declares Import-Package versions
        # The risk this repo keeps warning about, now confirmed rather than
        # anticipated: the modules compile against the aggregate
        # `release.dxp.api` jar, which carries no per-package Export-Package
        # metadata, so bnd cannot derive a range. Dropping an explicit range
        # from bnd.bnd yields an import with NO version at all -- verified by
        # removing two and rebuilding. The ranges in bnd.bnd are load-bearing.
        #
        # Checked per package. The previous spelling grepped the whole
        # Import-Package blob for `version=`, so one versioned import anywhere
        # made every unversioned one in the same bundle pass; a build with two
        # unversioned com.liferay imports went through it cleanly. `resolve`
        # does not cover this gap either -- an unversioned import matches any
        # exported version, so it resolves happily and then binds to whatever
        # the portal happens to have.
        run: |
          for jar in modules/*/build/libs/*.jar; do
            [ -e "$jar" ] || continue
            unzip -p "$jar" META-INF/MANIFEST.MF | tr -d '\r' | perl -0 -sne '
              my ($imports) = /^Import-Package: (.*?)^\S/ms;
              ($imports) = /^Import-Package: (.*)/ms if !defined $imports;
              $imports =~ s/\n //g;
              # Split on commas outside quotes, so a uses:="a,b" directive
              # does not fragment a clause.
              my (@clauses, $buf, $q) = ((), "", 0);
              for my $ch (split //, $imports) {
                $q = !$q if $ch eq q{"};
                if ($ch eq "," && !$q) { push @clauses, $buf; $buf = "" }
                else { $buf .= $ch }
              }
              push @clauses, $buf;

              my ($seen, $bad) = (0, 0);
              for my $c (@clauses) {
                $c =~ s/^\s+|\s+$//g;
                next unless $c =~ /^com\.liferay/;
                $seen++;
                my ($pkg) = $c =~ /^([^;]+)/;
                next if $c =~ /version=/;
                print "::error::$jar imports $pkg with no version range\n";
                $bad++;
              }
              print "::notice::$jar imports no com.liferay.* packages\n" if !$seen;
              exit($bad ? 1 : 0);
            ' -- -jar="$(basename "$jar")" || exit 1
          done

      - name: Publish to GitHub Packages
        # -Pversion must be passed here too. Without it the publish resolves to
        # the project default (1.0.0-SNAPSHOT), which publishes the wrong Maven
        # coordinate *and* leaves a second jar in build/libs that the staging
        # step below then globs - v1.0.0 shipped with both a 1.0.0 and a
        # 1.0.0-SNAPSHOT asset for every module because of this.
        if: github.event_name == 'release' || inputs.dry_run == false
        run: ./gradlew publish --no-daemon -Pversion="${{ steps.ver.outputs.version }}"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage release assets, named for the DXP line they were built against
        # The DXP version goes in the FILENAME, not just the metadata, so a
        # mismatch is visible at the point of download rather than surfacing
        # later as a resolution failure inside a portal. A checksum accompanies
        # each, matching how LDM verifies its own snapshot payloads.
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p dist
          # Match the release version explicitly rather than globbing every
          # jar: `clean` alone does not guarantee build/libs holds only what
          # this run produced, and an unexpected jar here becomes a published
          # asset.
          for jar in modules/*/build/libs/*-${{ steps.ver.outputs.version }}.jar; do
            [ -e "$jar" ] || continue
            base=$(basename "$jar" .jar)
            target="dist/${base}-${{ steps.ver.outputs.dxp }}.jar"
            cp "$jar" "$target"
            (cd dist && sha256sum "$(basename "$target")" > "$(basename "$target").sha256")
          done
          ls -l dist

          staged=$(ls dist/*.jar 2>/dev/null | wc -l | tr -d ' ')
          modules=$(ls -d modules/*/bnd.bnd 2>/dev/null | wc -l | tr -d ' ')

          if [ "$staged" -eq 0 ]; then
            echo "::error::no jars were staged"
            exit 1
          fi

          status=0
          for bnd in modules/*/bnd.bnd; do
            [ -e "$bnd" ] || continue
            module=$(basename "$(dirname "$bnd")")
            bsn=$(sed -n 's/^Bundle-SymbolicName:[[:space:]]*//p' "$bnd" | tr -d '\r')
            n=$(ls "dist/${bsn}-"*.jar 2>/dev/null | wc -l | tr -d ' ')
            if [ "$n" -ne 1 ]; then
              echo "::error::${module} (${bsn}) staged ${n} assets in dist/, expected exactly 1"
              status=1
            fi
          done
          [ "$status" -eq 0 ] || { ls -l dist; exit 1; }

          if [ "$staged" -ne "$modules" ]; then
            echo "::error::staged $staged jars for $modules bundle modules; unexpected extra asset in dist/"
            ls -l dist
            exit 1
          fi

          if ls dist/ | grep -qi snapshot; then
            echo "::error::a SNAPSHOT artefact reached the release staging area"
            ls -l dist
            exit 1
          fi

          # Emit machine-readable release manifest
          entries=()
          for bnd in modules/*/bnd.bnd; do
            [ -e "$bnd" ] || continue
            module=$(basename "$(dirname "$bnd")")
            bsn=$(sed -n 's/^Bundle-SymbolicName:[[:space:]]*//p' "$bnd" | tr -d '\r')
            target_jar=$(ls "dist/${bsn}-"*.jar 2>/dev/null | head -n 1)
            target_file=$(basename "$target_jar")
            bundle_ver=$(unzip -p "$target_jar" META-INF/MANIFEST.MF | sed -n 's/^Bundle-Version:[[:space:]]*//p' | tr -d '\r')
            sha=$(cut -d ' ' -f 1 "dist/${target_file}.sha256")
            replaces_raw=$(unzip -p "$target_jar" META-INF/MANIFEST.MF \
              | tr -d '\r' | perl -0pe 's/\n //g' \
              | sed -n 's/^Replaces:[[:space:]]*//p')
            if grep -q '^Replaces:' "$bnd" && [ -z "$replaces_raw" ]; then
              echo "::error::${module}: bnd.bnd declares Replaces but it is absent from the built manifest"
              exit 1
            fi
            if [ -n "$replaces_raw" ]; then
              replaces_json=$(echo "$replaces_raw" | jq -c -R 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
            else
              replaces_json="[]"
            fi
            entries+=("\"${bsn}\":{\"module\":\"${module}\",\"bsn\":\"${bsn}\",\"version\":\"${bundle_ver}\",\"dxpLine\":\"${{ steps.ver.outputs.dxp }}\",\"replaces\":${replaces_json},\"asset\":\"${target_file}\",\"sha256\":\"${sha}\"}")
          done

          joined=$(IFS=,; echo "${entries[*]}")
          tag="${{ github.event.release.tag_name }}"
          [ -n "$tag" ] || tag="v${{ steps.ver.outputs.version }}"

          # Construct manifest deterministically with sorted keys so modules.json is
          # byte-stable across rebuilds, allowing modules.json.sha256 to be compared meaningfully.
          jq -n -S \
            --arg tag "$tag" \
            --argjson bundles "{$joined}" \
            '{schemaVersion: 1, release: $tag, bundles: $bundles}' > dist/modules.json
          # Note: modules.json.sha256 validates download/transport integrity, while
          # the inner per-bundle sha256 digests provide the verifiable asset anchors.
          (cd dist && sha256sum modules.json > modules.json.sha256)

          # Verify the manifest strictly matches the staged set
          schema_ver=$(jq -r '.schemaVersion' dist/modules.json)
          if [ "$schema_ver" != "1" ]; then
            echo "::error::manifest schemaVersion is '$schema_ver', expected 1"
            exit 1
          fi

          manifest_count=$(jq '.bundles | length' dist/modules.json)
          if [ "$manifest_count" -ne "$modules" ]; then
            echo "::error::modules.json describes $manifest_count bundles, expected $modules"
            exit 1
          fi

          for key in $(jq -r '.bundles | keys[]' dist/modules.json); do
            row_bsn=$(jq -r ".bundles[\"${key}\"].bsn" dist/modules.json)
            if [ "$key" != "$row_bsn" ]; then
              echo "::error::modules.json key '$key' does not match bundle bsn '$row_bsn'"
              exit 1
            fi
            is_array=$(jq ".bundles[\"${key}\"].replaces | type == \"array\"" dist/modules.json)
            if [ "$is_array" != "true" ]; then
              echo "::error::modules.json bundle '$key' replaces must be an array"
              exit 1
            fi
            # Validate BSN grammar and assert no collision with active bundles in this release
            for rep in $(jq -r ".bundles[\"${key}\"].replaces[]" dist/modules.json 2>/dev/null); do
              if ! echo "$rep" | grep -qE '^[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)+$'; then
                echo "::error::replaces entry '$rep' on bundle '$key' is not a valid Bundle-SymbolicName"
                exit 1
              fi
              if jq -e ".bundles[\"${rep}\"]" dist/modules.json >/dev/null 2>&1; then
                echo "::error::bundle '$key' claims to replace '$rep', which is also an active bundle in this release"
                exit 1
              fi
            done
          done

          # Assert no two bundles claim to replace the same predecessor BSN
          all_replaces=$(jq -r '.bundles[].replaces[]' dist/modules.json 2>/dev/null)
          if [ -n "$all_replaces" ]; then
            duplicates=$(echo "$all_replaces" | sort | uniq -d)
            if [ -n "$duplicates" ]; then
              echo "::error::duplicate replaces entries detected across bundles: $duplicates"
              exit 1
            fi
          fi

          for row in $(jq -r '.bundles[] | @base64' dist/modules.json); do
            _jq() { echo "$row" | base64 --decode | jq -r "$1"; }
            asset=$(_jq '.asset')
            sha=$(_jq '.sha256')
            if [ ! -f "dist/${asset}" ]; then
              echo "::error::modules.json references missing asset dist/${asset}"
              exit 1
            fi
            actual_sha=$(sha256sum "dist/${asset}" | cut -d ' ' -f 1)
            if [ "$actual_sha" != "$sha" ]; then
              echo "::error::modules.json sha256 mismatch for ${asset}"
              exit 1
            fi
          done
          (cd dist && sha256sum -c modules.json.sha256)

      - name: Archive staged assets on dry run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dist-staged-dry-run
          path: dist/

      - name: Attach assets to the release
        # GitHub Packages' Maven registry requires authentication even for
        # public packages, so a release asset is the only anonymous way to get
        # a bundle. That matters here: the primary consumption path is a file
        # dropped into osgi/modules, not a Maven coordinate.
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
